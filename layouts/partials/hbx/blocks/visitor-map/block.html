{{/* Visitor Map Block - Compact version */}}
{{ $block := .wcBlock }}

<section class="hbx-section">
<div class="visitor-map-block max-w-screen-xl mx-auto" style="text-align: center; padding: 1rem;">
  <div style="display: flex; justify-content: center; align-items: center;">
    <div id="mmvst-globe-container"></div>
  </div>
</div>
</section>

<script type="text/javascript">
(function() {
  var script = document.createElement('script');
  script.type = 'text/javascript';
  script.id = 'mmvst_globe';
  script.src = 'https://mapmyvisitors.com/globe.js?d=KpdeV7KgHhDN7E2IreI7-pVbrVGFciJfn2Jp7iAF7MA';
  script.async = true;
  var container = document.getElementById('mmvst-globe-container');
  if (container) {
    container.appendChild(script);
  }
})();
</script>
